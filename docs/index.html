<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebSnapShot - Take a Website Screenshot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <form id="urlForm" action="/screenshot" method="POST">
        <h2>Enter a Website URL</h2>
        <input
          type="url"
          name="url"
          placeholder="https://example.com"
          required
        />
        <button type="submit">Take Screenshot</button>
        <p class="note">
          Note: This demo needs a backend and won't work on GitHub Pages. But it
          does work in the terminal!
        </p>
      </form>
    </main>
    <footer>
      <h1>Developed by Alex</h1>
    </footer>
  </body>
</html>
